name: SMITH BUSINESS OS CI
on:
  pull_request:
    paths:
      - 'business-os/**'
      - '.github/workflows/business-os.yml'
  push:
    branches: [main]
    paths:
      - 'business-os/**'
      - '.github/workflows/business-os.yml'
permissions:
  contents: read
jobs:
  security-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test API isolation, approvals and metrics
        run: npm test
        working-directory: business-os
      - name: Syntax validation
        run: npm run check
        working-directory: business-os
